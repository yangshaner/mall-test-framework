# 权限配置
permission:
  # 不需要认证接口
  public_apis:
    - /sso/login
    - /sso/regoster
    - /sso/getAuthCode
    - /sso/updatePassword

  # 角色与API映射
  role_api_mapping:
    admin:
      - /admin/**
      - /product/**
      - /order/**
      - /brand/**
      - /coupon/**
      - /flash/**

    product_admin:
      - /product/**
      - /brand/**
      - /category/**

    order_admin:
      - /order/**

    readonly:
      - /product/**/list
      - /order/**/list
      - /brand/**/list
      - /coupon/**/list