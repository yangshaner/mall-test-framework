# pytest.ini
[pytest]
minversion = 7.0
testpaths = testcases
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 命令行参数
addopts =
    -v
    --strict-markers
    --tb=short
    --maxfail=5
    --html=reports/test_report.html
    --self-contained-html
    --alluredir=reports/allure-results

# 标记
markers =
    smoke: 冒烟测试
    regression: 回归测试
    admin: 后台管理测试
    member: 前台用户测试
    product: 商品管理测试
    order: 订单管理测试
    marketing: 营销管理测试
    home: 首页配置ceshi
    file: 文件服务测试
    slow: 慢速测试
    skip: 跳过测试